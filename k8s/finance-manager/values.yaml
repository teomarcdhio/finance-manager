# Default values for finance-manager.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/teomarcdhio/finance-manager-backend
    pullPolicy: Always
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: false
  resources: {}
  env:
    POSTGRES_SERVER: "postgres-rw.postgres.svc.cluster.local"
    POSTGRES_USER: "finance-manager"
    POSTGRES_DB: "finance-manager"
  secret:
    name: "finance-db-secret"
    key: "postgres-password"
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/teomarcdhio/finance-manager-frontend
    pullPolicy: Always
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: finance.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  resources: {}
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

istio:
  enabled: true
  injection: enabled
  gateway:
    name: finance-manager-gateway
    selector:
      istio: ingress-gateway
    hosts:
      - "finance-manager.internal.nivetek.com"
  virtualService:
    name: finance-manager
    hosts:
      - "finance-manager.internal.nivetek.com"
